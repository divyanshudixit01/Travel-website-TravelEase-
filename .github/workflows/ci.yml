name: TravelEase CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Verify Code Style & Lint Conformance
      run: npm run lint

    - name: Run Core Platform Sanity & Security Tests
      run: node tests/coreFlows.test.js

    - name: Build Frontend Production Bundle
      run: npm run build

    - name: Install Server Dependencies
      working-directory: ./server
      run: npm ci

    - name: Verify Server Syntax
      working-directory: ./server
      run: node -c src/index.js
