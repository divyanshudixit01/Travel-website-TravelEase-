<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Light Mode Supersonic Aero Gradient -->
    <linearGradient id="lightAeroGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wing Depth Gradient -->
    <linearGradient id="lightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="lightOrbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Ease Gradient -->
    <linearGradient id="lightTextEaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK (Left: 0 - 120) -->
  <g transform="translate(10, 0)">
    <!-- Precision Rings -->
    <circle cx="60" cy="60" r="48" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 6" />
    <circle cx="60" cy="60" r="52" stroke="#D97706" stroke-opacity="0.2" stroke-width="1" />

    <!-- Orbital Path -->
    <ellipse cx="60" cy="60" rx="46" ry="18" transform="rotate(-32 60 60)" 
             stroke="url(#lightOrbitGrad)" stroke-width="2.5" stroke-dasharray="140 16 10 16" fill="none" />
    
    <circle cx="24" cy="40" r="3" fill="#D97706" />
    <circle cx="96" cy="80" r="2.5" fill="#0284C7" />

    <!-- Supersonic Jet Arrow -->
    <g>
      <path d="M60 18 L28 76 L60 62 Z" fill="url(#lightWingGrad)" opacity="0.95" />
      <path d="M60 18 L92 76 L60 62 Z" fill="url(#lightAeroGrad)" />
      <path d="M60 18 L60 88 L55 64 Z" fill="#0369A1" />
      <path d="M60 18 L60 88 L65 64 Z" fill="#D97706" />
      <polygon points="56,66 60,94 64,66 60,69" fill="#B45309" opacity="0.9" />
    </g>

    <!-- Polaris Star -->
    <circle cx="60" cy="18" r="2.5" fill="#0F172A" />
    <path d="M60 13 L60 23 M55 18 L65 18" stroke="#0F172A" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- BRAND TYPOGRAPHY (Right: 135 - 540) -->
  <!-- "Travel" -->
  <text x="145" y="72" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="52" font-weight="800" fill="#0F172A" letter-spacing="-1">Travel</text>

  <!-- "Ease" -->
  <text x="312" y="72" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="52" font-weight="900" fill="url(#lightTextEaseGrad)" letter-spacing="-1">Ease</text>

  <!-- Tagline / Descriptor -->
  <text x="148" y="98" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" font-weight="700" fill="#64748B" letter-spacing="3.5">MULTI-MODAL TRAVEL OPERATING SYSTEM</text>

  <!-- Micro Accent Dot -->
  <circle cx="510" cy="94" r="3" fill="#0891B2" />
</svg>
