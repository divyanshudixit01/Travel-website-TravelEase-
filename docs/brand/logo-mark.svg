<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Supersonic Aero Gradient -->
    <linearGradient id="aeroGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Wing Shadow / Depth Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGlow)" />

  <!-- Outer Precision Compass Tick Marks -->
  <circle cx="60" cy="60" r="48" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 6" />
  <circle cx="60" cy="60" r="52" stroke="#F59E0B" stroke-opacity="0.15" stroke-width="1" />

  <!-- Orbital Elliptical Transit Path -->
  <ellipse cx="60" cy="60" rx="46" ry="18" transform="rotate(-32 60 60)" 
           stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="140 16 10 16" fill="none" filter="url(#glow)" />
  
  <!-- Orbital Waypoint Nodes -->
  <circle cx="24" cy="40" r="3" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="96" cy="80" r="2.5" fill="#38BDF8" />

  <!-- Central Dynamic Supersonic Travel Arrow / Origami Bird Emblem -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M60 18 L28 76 L60 62 Z" fill="url(#wingGrad)" opacity="0.95" />
    
    <!-- Right Wing (Illuminated) -->
    <path d="M60 18 L92 76 L60 62 Z" fill="url(#aeroGrad)" />
    
    <!-- Central Keel & Cockpit Core -->
    <path d="M60 18 L60 88 L55 64 Z" fill="#0284C7" />
    <path d="M60 18 L60 88 L65 64 Z" fill="#FBBF24" />

    <!-- Trailing Energy Thrust -->
    <polygon points="56,66 60,94 64,66 60,69" fill="#F59E0B" opacity="0.9" />
  </g>

  <!-- North Star / Polaris Sparkle -->
  <g transform="translate(60, 18)">
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    <path d="M0 -5 L0 5 M-5 0 L5 0" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
