    <!-- Open Graph / Social Sharing -->

    <meta property="og:title" content="TravelEase — Next-Gen Multi-Modal Travel Platform" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="TravelEase — Next-Gen Multi-Modal Travel Platform" />

    <!-- LCP Hero Image Preload for Instant First Paint -->

    <!-- Google Fonts: Space Grotesk (Headlines) + Inter (Body/UI/Data) + Outfit (Brand Identity) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Schema.org: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.travelease.com/#organization",
      "name": "TravelEase",
      "url": "https://www.travelease.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.travelease.com/brand/logo-mark.svg",
        "width": 512,
        "height": 512
      },
      "description": "TravelEase is the ultimate multi-modal travel platform. Pan-India IRCTC live train tracking, international flights, interactive hotel maps, and AI trip architect.",
      "foundingDate": "2026",
      "founder": {
        "@type": "Person",
        "name": "Divyanshu Dixit",
        "jobTitle": "Founder & CEO"
      },
      "sameAs": [
        "https://www.facebook.com/travelease",
        "https://twitter.com/travelease",
        "https://www.instagram.com/travelease",
        "https://www.linkedin.com/company/travelease",
        "https://www.youtube.com/travelease"
      ],
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+1-800-123-4567",
          "contactType": "sales",
          "availableLanguage": ["English"]
        },
        {
          "@type": "ContactPoint",
          "email": "support@travelease.com",
          "contactType": "customer support",
          "availableLanguage": ["English"]
        }
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "One World Trade Center, Suite 4500",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10007",
        "addressCountry": "US"
      }
    }
    </script>

    <!-- Schema.org: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.travelease.com/#website",
      "name": "TravelEase",
      "url": "https://www.travelease.com",
      "publisher": { "@id": "https://www.travelease.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.travelease.com/destinations?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Global Offline Image Resilience Fallback (Catches failed network images when offline) -->
    <script>
      (function() {
        var OFFLINE_FALLBACKS = [
          '/hero_day_dolomites.jpg',
          '/images/destinations/hero_bali_sunsets.jpg',
          '/images/destinations/hero_amalfi_coast.jpg',
          '/images/destinations/wonders_taj_mahal.jpg',
          '/images/trains/ir_vande_bharat.jpg',
          '/hero_mountain_day.jpg'
        ];
        var fallbackIdx = 0;
        window.addEventListener('error', function(event) {
          var target = event.target;
          if (target && target.tagName === 'IMG') {
            var currentSrc = target.getAttribute('src') || target.src || '';
            if (!currentSrc.startsWith('/hero_') && !currentSrc.startsWith('/images/')) {
              target.onerror = null;
              target.src = OFFLINE_FALLBACKS[(fallbackIdx++) % OFFLINE_FALLBACKS.length];
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#06080d] dark:text-slate-100 font-sans antialiased selection:bg-amber-400/30 selection:text-amber-900 dark:selection:bg-amber-500/20 dark:selection:text-amber-200 transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
